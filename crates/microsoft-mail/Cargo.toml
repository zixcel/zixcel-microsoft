[package]
name = "zixcel-microsoft-mail"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "Apache-2.0"
repository = "https://github.com/zixcel/zixcel-microsoft"
description = "Portable bounded Microsoft Graph mail requests and application token responses"
publish = false
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
zeroize = "1"
[lints.rust]
unsafe_code = "forbid"
[lints.clippy]
all = "warn"
