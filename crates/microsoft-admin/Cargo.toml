[package]
name = "zixcel-microsoft-admin"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/zixcel/zixcel-microsoft"
description = "Tenant-bound Microsoft discovery and approved Exchange recipient administration"
publish = false
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
url = "2"
zeroize = "1"
crowsi-provider-read-http = { git = "https://github.com/crowsi-net/crowsi-transport-foundation", rev = "8daf36688e1618f294274c61ebfe607f77639534" }
crowsi-process-adapter = { git = "https://github.com/crowsi-net/crowsi-process-adapter", rev = "bb2c7abb0dad073434c4d6fe0a8bc983746f322b" }
tokio = { version = "1", features = ["rt", "io-util", "time", "macros"] }
[dev-dependencies]
tempfile = "3"
[lints.rust]
unsafe_code = "forbid"
[lints.clippy]
all = "warn"
