[package]
name = "zixcel-microsoft-cli"
version = "0.2.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/zixcel/zixcel-microsoft"
description = "Reviewed native microsoft observations through the zix protocol"
publish = false
[[bin]]
name = "zix-microsoft"
path = "src/main.rs"
[dependencies]
zix-native-provider = { git = "https://github.com/zixcel/cli", rev = "8fbd566aa53a52d4a588fef537683be2a604b02a" }
zixcel-microsoft-admin = { path = "../microsoft-admin" }
zix-cli = { git = "https://github.com/zixcel/cli", rev = "8fbd566aa53a52d4a588fef537683be2a604b02a" }
zix-operation-contracts = { git = "https://github.com/zixcel/cli", rev = "8fbd566aa53a52d4a588fef537683be2a604b02a" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"
[dev-dependencies]
serde_json = "1.0"
[lints.rust]
unsafe_code = "forbid"
[lints.clippy]
all = "warn"
