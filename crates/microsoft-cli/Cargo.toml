[package]
name = "zixcel-microsoft-cli"
version = "0.5.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/zixcel/zixcel-microsoft"
description = "Reviewed native microsoft observations through the zix protocol"
publish = false
[[bin]]
name = "zix-microsoft"
path = "src/main.rs"
[dependencies]
zix-native-provider = { git = "https://github.com/zixcel/cli", rev = "c00dcd435d147c43cc6a6cb93a0e667d33a6d297" }
zixcel-microsoft-admin = { path = "../microsoft-admin" }
zix-cli = { git = "https://github.com/zixcel/cli", rev = "c00dcd435d147c43cc6a6cb93a0e667d33a6d297" }
zix-operation-contracts = { git = "https://github.com/zixcel/cli", rev = "c00dcd435d147c43cc6a6cb93a0e667d33a6d297" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"
[features]
default = []
credential-store = ["dep:crowsi-credential-broker"]
[target.'cfg(target_os = "linux")'.dependencies]
crowsi-credential-broker = { version = "=0.1.2", default-features = false, features = ["linux-secret-service"], optional = true }
[dev-dependencies]
serde_json = "1.0"
[lints.rust]
unsafe_code = "forbid"
[lints.clippy]
all = "warn"
