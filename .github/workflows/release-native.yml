name: Release native provider
on:
  pull_request:
  push:
    branches: [main]
    tags: ['native/microsoft/v*']
permissions:
  contents: read
concurrency:
  group: native-release-${{ github.repository }}
  cancel-in-progress: false
jobs:
  release-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: bash tools/native-release/test-admission.sh
  prepare:
    if: github.event_name == 'push' && github.ref_type == 'tag' && github.event.repository.private == false
    needs: release-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    env:
      ZIX_RELEASE_SOURCE: ${{ github.sha }}
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
      sha256: ${{ steps.digest.outputs.sha256 }}
      filename: ${{ steps.digest.outputs.filename }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.97.1
          targets: x86_64-unknown-linux-musl
      - name: Admit exact owner version and successful main native CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/native-release/admit.sh
      - name: Build and validate immutable archive
        id: digest
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends musl-tools libsecret-1-dev
          bash tools/native-release/prepare.sh "$RUNNER_TEMP/native"
          cd "$RUNNER_TEMP/native"
          test "$(wc -l < SHA256SUMS)" = 2
          echo "sha256=$(sha256sum SHA256SUMS | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "filename=SHA256SUMS" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        id: upload
        with:
          name: native-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/native/*.tar.gz
            ${{ runner.temp }}/native/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
  publish:
    if: vars.NATIVE_PUBLISH_ENABLED == 'true'
    needs: prepare
    environment: native-public
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact }}
          merge-multiple: true
          path: ${{ runner.temp }}/native
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: ${{ runner.temp }}/native/*.tar.gz
      - name: Publish once and verify exact released bytes
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ needs.prepare.outputs.sha256 }}
          ARCHIVE: ${{ needs.prepare.outputs.filename }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/native"
          [[ "$DIGEST" =~ ^[a-f0-9]{64}$ && "$ARCHIVE" = SHA256SUMS ]]
          printf '%s  %s\n' "$DIGEST" "$ARCHIVE" | sha256sum --check
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" > "$RUNNER_TEMP/release" 2> "$RUNNER_TEMP/error"; then
            echo 'Existing release: verification only; no overwrite.'
          else
            grep -q '(HTTP 404)' "$RUNNER_TEMP/error"; test "$GITHUB_RUN_ATTEMPT" = 1
            gh release create "$GITHUB_REF_NAME" ./*.tar.gz SHA256SUMS --repo "$GITHUB_REPOSITORY" --verify-tag --target "$GITHUB_SHA" --title "$GITHUB_REF_NAME" --notes "Source $GITHUB_SHA; archive SHA256 $DIGEST."
          fi
          mkdir readback
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern "*.tar.gz" --pattern SHA256SUMS --dir readback
          test "$(sha256sum "readback/$ARCHIVE" | cut -d' ' -f1)" = "$DIGEST"
          (cd readback; sha256sum --check SHA256SUMS)
          printf 'Verified `%s` source `%s` SHA256 `%s`.\n' "$GITHUB_REF_NAME" "$GITHUB_SHA" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
