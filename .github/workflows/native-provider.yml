name: Native provider contracts
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  native-provider:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-musl
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Verify official Exchange command mapping without connecting
        shell: pwsh
        run: ./crates/microsoft-admin/tests/exchange-bridge.ps1
      - name: Install custody dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libsecret-1-dev
      - run: cargo fmt --all --check
      - run: cargo test --locked --workspace --all-targets --all-features
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Audit locked native dependencies
        run: |
          cargo install cargo-audit --version 0.22.2 --locked --no-default-features
          cargo audit --deny warnings
      - name: Prepare static native candidate without publication
        env:
          ZIX_RELEASE_SOURCE: ${{ github.sha }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends musl-tools
          cargo build --locked -p zix-cli --bin zix
          bash tools/native-release/prepare.sh "$RUNNER_TEMP/native"
          node tools/native-release/test-dispatcher.mts "$PWD/target/debug/zix" "$RUNNER_TEMP/native/x86_64-unknown-linux-gnu/unpacked/"*/zix-microsoft "$RUNNER_TEMP/native/x86_64-unknown-linux-gnu/unpacked/"*/microsoft.extension.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-provider-linux-${{ github.sha }}
          path: |
            ${{ runner.temp }}/native/*.tar.gz
            ${{ runner.temp }}/native/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
